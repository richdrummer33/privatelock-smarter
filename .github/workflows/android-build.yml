name: Android CI

on:
  push:
    branches:
      - master
      - claude/private-lock-motion-classifier-62enab
      - "claude/**"
      - "feature/**"
      - "fix/**"

  pull_request:
    branches:
      - master

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: Motion Core — JDK ${{ matrix.java }}

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        java:
          - "17"
          - "21"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build motion-core
        run: |
          ./gradlew \
            :motion-core:clean \
            :motion-core:build \
            --stacktrace \
            --warning-mode all

      - name: Upload motion-core reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motion-core-reports-jdk-${{ matrix.java }}-${{ github.sha }}
          path: |
            motion-core/build/reports/tests/
            motion-core/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  android:
    name: Android Debug Build

    runs-on: ubuntu-latest

    needs: core

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Android app
        run: |
          ./gradlew \
            :motion-core:test \
            :app:testFossDebugUnitTest \
            :app:lintFossDebug \
            :app:assembleFossDebug \
            --stacktrace \
            --warning-mode all

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: privatelock-smarter-debug-${{ github.sha }}
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.sha }}
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 14

  emulator:
    name: Emulator API ${{ matrix.api }}

    runs-on: ubuntu-latest

    needs:
      - android

    strategy:
      fail-fast: false
      matrix:
        api:
          - 29
          - 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          disk-size: 6000M
          heap-size: 2048M
          script: |
            ./gradlew \
              :app:connectedFossDebugAndroidTest \
              --stacktrace \
              --warning-mode all
